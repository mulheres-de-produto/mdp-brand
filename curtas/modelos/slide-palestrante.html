<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MDP Curtas · slide-palestrante</title>
<meta name="mdp-curtas-tamanho" content="1920x1080">
<meta name="mdp-curtas-campos" content="bio,cargo,cidade,foto_palestrante,nome_palestrante">
<style>
@font-face{font-family:'Montserrat';font-weight:400;src:url(../assets/fontes/Montserrat-Regular.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:500;src:url(../assets/fontes/Montserrat-Medium.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:600;src:url(../assets/fontes/Montserrat-SemiBold.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:700;src:url(../assets/fontes/Montserrat-Bold.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:800;src:url(../assets/fontes/Montserrat-ExtraBold.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:900;src:url(../assets/fontes/Montserrat-Black.ttf) format('truetype')}
html,body{margin:0;padding:0}
.s0{-webkit-mask-image:url(../assets/formas/forma-0.svg);mask-image:url(../assets/formas/forma-0.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s1{-webkit-mask-image:url(../assets/formas/forma-1.svg);mask-image:url(../assets/formas/forma-1.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s2{-webkit-mask-image:url(../assets/formas/forma-2.svg);mask-image:url(../assets/formas/forma-2.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s3{-webkit-mask-image:url(../assets/formas/forma-3.svg);mask-image:url(../assets/formas/forma-3.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s4{-webkit-mask-image:url(../assets/formas/forma-4.svg);mask-image:url(../assets/formas/forma-4.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s5{-webkit-mask-image:url(../assets/formas/forma-5.svg);mask-image:url(../assets/formas/forma-5.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s6{-webkit-mask-image:url(../assets/formas/forma-6.svg);mask-image:url(../assets/formas/forma-6.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.s7{-webkit-mask-image:url(../assets/formas/forma-7.svg);mask-image:url(../assets/formas/forma-7.svg);-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; background: #FFFFFF; overflow: hidden; font-family:'Montserrat',sans-serif; color: #141414; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; flex-direction: row; justify-content: center; gap: 110px; padding: 0 120px 0 100px">
<div style="position: relative; flex-shrink: 0; width: 960px; height: 787px">
<div class="s4" style="position: absolute; left: 538px; top: 0px; width: 288px; height: 279px; background: #F2D1E0"></div>
<div class="s3" style="position: absolute; left: 739px; top: 317px; width: 211px; height: 220px; background: #F964A5"></div>
<div class="s6" style="position: absolute; left: 86px; top: 288px; width: 163px; height: 170px; background: #F78052"></div>
<img class="s0" src="{{foto_palestrante}}" alt="Foto da palestrante" style="position: absolute; left: 192px; top: 58px; width: 557px; height: 540px; object-fit: cover">
<div class="s5" style="position: absolute; left: 797px; top: 538px; width: 134px; height: 144px; background: #F78052"></div>
<img src="../assets/formas/contorno-espiral.svg" alt="" aria-hidden="true" style="position: absolute; left: 106px; top: 384px; width: 182px; height: 186px">
<img src="../assets/formas/contorno-concentrico.svg" alt="" aria-hidden="true" style="position: absolute; left: 576px; top: 451px; width: 346px; height: 335px">
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: flex-start">
<span style="display: inline-block; background: #FDEEF5; border: 3px solid #F964A5; color: #F964A5; font-size: 26px; font-weight: 700; letter-spacing: 0.06em; padding: 14px 34px; border-radius: 999px">PALESTRANTE DA NOITE</span>
<span style="margin-top: 36px; font-size: 104px; font-weight: 700; line-height: 1.02; letter-spacing: -0.015em">{{nome_palestrante}}</span>
<span style="margin-top: 26px; font-size: 38px; font-weight: 600; color: #F964A5">{{cargo}}</span>
<p style="margin: 26px 0 0; max-width: 720px; font-size: 28px; font-weight: 400; line-height: 1.5; color: #4A4A4A">{{bio}}</p>
<div style="margin-top: 64px; display: flex; align-items: center; gap: 26px">
<img src="../../marca/svg/mdp-marca-principal.svg" alt="mulheres de produto" style="height: 60px; display: block">
<span style="width: 2px; height: 44px; background: #F2D1E0"></span>
<span style="font-size: 24px; font-weight: 600">Curtas {{cidade}}</span>
</div>
</div>
</div>
</body>
</html>
